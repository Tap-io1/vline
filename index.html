<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vline Salon</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #bdbdbd;
    color: #111111;
    overflow-x: hidden;
}

/* =========================
   SUBTLE BLACK BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 12% 18%,
            rgba(0,0,0,0.09) 0px,
            rgba(0,0,0,0.09) 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 82% 72%,
            rgba(0,0,0,0.08) 0px,
            rgba(0,0,0,0.08) 1px,
            transparent 2px
        ),
        linear-gradient(
            135deg,
            transparent 0%,
            transparent 47%,
            rgba(0,0,0,0.035) 48%,
            transparent 49%,
            transparent 100%
        );

    background-size:
        260px 260px,
        320px 320px,
        100% 100%;

    pointer-events: none;
    z-index: -2;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    padding: 28px 20px 35px;

    text-align: center;
}

/* =========================
   LOGO
========================= */

.logo-wrapper {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 10px;
}

.logo {
    width: 300px;
    height: 300px;

    max-width: 90vw;

    object-fit: contain;

    display: block;
}

/* =========================
   STORE NAME
========================= */

.store-name {
    font-size: 24px;

    font-weight: 800;

    letter-spacing: 3px;

    color: #111111;

    margin-top: 0;
    margin-bottom: 7px;

    text-transform: uppercase;
}

/* =========================
   ADDRESS
========================= */

.address {
    font-size: 14px;

    color: #292929;

    font-weight: 500;

    margin-bottom: 24px;
}

/* =========================
   DIVIDER
========================= */

.divider {
    width: 55px;
    height: 2px;

    background: #111111;

    margin: 0 auto 24px;

    opacity: 0.65;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.btn {
    width: 100%;

    min-height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    padding: 15px 20px;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;

    font-weight: 700;

    background: #111111;

    border: 1px solid #111111;

    border-radius: 12px;

    box-shadow:
        0 5px 14px rgba(0,0,0,0.14);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-2px);

    background: #222222;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.2);
}

.btn:active {
    transform: scale(0.98);
}

/* =========================
   ICONS
========================= */

.icon {
    width: 23px;
    height: 23px;

    flex-shrink: 0;
}

/* =========================
   FOOTER
========================= */

.footer-line {
    display: flex;

    align-items: center;
    justify-content: center;

    margin-top: 30px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #111111;

    opacity: 0.45;
}

.footer-symbol {
    margin: 0 12px;

    font-size: 15px;

    color: #111111;
}

.footer {
    margin-top: 15px;

    font-size: 11px;

    color: #444444;

    letter-spacing: 1px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .container {
        padding-left: 15px;
        padding-right: 15px;
    }

    .logo {
        width: 275px;
        height: 275px;
    }

    .store-name {
        font-size: 21px;
    }

    .btn {
        min-height: 55px;
        font-size: 14px;
    }
}

</style>
</head>
